name: Deploy CloudBot to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # One Worker (apps/api) serves the API at /api, the chat app at / and the
  # admin dashboard at /dashboard. Both front ends are Next.js static exports
  # served as Workers static assets.
  deploy:
    name: Deploy CloudBot
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.BETTER_AUTH_URL }}
      NEXT_PUBLIC_ENABLE_EMAIL_SIGNUP: ${{ vars.ENABLE_EMAIL_SIGNUP }}
      NEXT_PUBLIC_ENABLE_OAUTH_LOGIN: ${{ vars.ENABLE_OAUTH_LOGIN }}
      NEXT_PUBLIC_ENABLE_SSO: "false"
      NEXT_PUBLIC_LLM_MODELS: ${{ vars.NEXT_PUBLIC_LLM_MODELS }}
      NEXT_PUBLIC_ADMIN_USER_IDS: ${{ vars.ADMIN_USER_IDS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build --filter=@workspace/server --filter=@workspace/api-routes

      - name: Build web app (static export)
        run: pnpm run build
        working-directory: apps/web

      - name: Build dashboard (static export)
        run: pnpm run build
        working-directory: apps/dashboard

      - name: Assemble static assets
        run: pnpm run build-assets
        working-directory: apps/api

      - name: Apply D1 database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/api
          command: d1 migrations apply CLOUDBOT_DB --env=production --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/api
          environment: production
          command: deploy --minify
          # Every name listed here must have a value, or the deploy fails.
          # Add TAVILY_API_KEY here once that GitHub secret exists.
          secrets: |
            NODE_ENV
            BETTER_AUTH_URL
            ADMIN_USER_IDS
            ALLOWED_ORIGINS
            ENABLE_EMAIL_SIGNUP
            ENABLE_OAUTH_LOGIN
            RESEND_SENDER_EMAIL
            NEXT_PUBLIC_LLM_MODELS
            AUTORAG_NAME
            R2_ENDPOINT
            R2_BUCKET_NAME
            CLOUDFLARE_ACCESS_KEY_ID
            SEARCH_PROVIDER

            BETTER_AUTH_SECRET
            ENCRYPTION_KEY
            RESEND_API_KEY
            CLOUDFLARE_SECRET_ACCESS_KEY
            OPENROUTER_API_KEY
        env:
          # Non-sensitive configuration vars
          NODE_ENV: ${{ vars.NODE_ENV }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          ADMIN_USER_IDS: ${{ vars.ADMIN_USER_IDS }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ENABLE_EMAIL_SIGNUP: ${{ vars.ENABLE_EMAIL_SIGNUP }}
          ENABLE_OAUTH_LOGIN: ${{ vars.ENABLE_OAUTH_LOGIN }}
          ALLOWED_EMAIL_DOMAINS: ${{ vars.ALLOWED_EMAIL_DOMAINS }}
          RESEND_SENDER_EMAIL: ${{ vars.RESEND_SENDER_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
          GITLAB_CLIENT_ID: ${{ vars.GITLAB_CLIENT_ID }}
          NEXT_PUBLIC_LLM_MODELS: ${{ vars.NEXT_PUBLIC_LLM_MODELS }}
          AUTORAG_NAME: ${{ vars.AUTORAG_NAME }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_ACCESS_KEY_ID }}
          SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER }}

          # Sensitive secrets
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          GITLAB_CLIENT_SECRET: ${{ secrets.GITLAB_CLIENT_SECRET }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
